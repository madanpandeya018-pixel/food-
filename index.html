<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Showroom</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f0f0f0;
        }
        header {
            background: #000;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .card {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            transition: 0.3s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .info {
            padding: 15px;
            text-align: center;
        }
        .price {
            color: green;
            font-weight: bold;
        }
        button {
            background: black;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: gray;
        }
    </style>
</head>
<body>

<header>
    <h1>🚗 Car Showroom</h1>
    <p>Select your favorite car</p>
</header>

<div class="container">

    <div class="card">
        <img src="https://images.pexels.com/photos/358070/pexels-photo-358070.jpeg" alt="Tesla">
        <div class="info">
            <h3>Tesla Model S</h3>
            <p class="price">$80,000</p>
            <button>Buy Now</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.pexels.com/photos/170811/pexels-photo-170811.jpeg" alt="BMW">
        <div class="info">
            <h3>BMW M4</h3>
            <p class="price">$70,000</p>
            <button>Buy Now</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.pexels.com/photos/210019/pexels-photo-210019.jpeg" alt="Audi">
        <div class="info">
            <h3>Audi R8</h3>
            <p class="price">$120,000</p>
            <button>Buy Now</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.pexels.com/photos/100650/pexels-photo-100650.jpeg" alt="Mercedes">
        <div class="info">
            <h3>Mercedes C-Class</h3>
            <p class="price">$60,000</p>
            <button>Buy Now</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.pexels.com/photos/358070/pexels-photo-358070.jpeg" alt="Lamborghini">
        <div class="info">
            <h3>Lamborghini Huracan</h3>
            <p class="price">$200,000</p>
            <button>Buy Now</button>
        </div>
    </div>

    <div class="card">
        <img src="https://images.pexels.com/photos/1592384/pexels-photo-1592384.jpeg" alt="Mustang">
        <div class="info">
            <h3>Ford Mustang</h3>
            <p class="price">$55,000</p>
            <button>Buy Now</button>
        </div>
    </div>

</div>

</body>
</html>
