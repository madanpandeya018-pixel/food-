<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Real Car Showroom</title>

<style>
body {
    margin: 0;
    font-family: Georgia, serif;
    background: #f5f2ec;
}
header {
    background: #1a1a1a;
    color: white;
    text-align: center;
    padding: 20px;
}
nav {
    background: #333;
    text-align: center;
    padding: 10px;
}
nav button {
    background: none;
    border: none;
    color: white;
    margin: 10px;
    font-size: 16px;
    cursor: pointer;
}
nav button:hover {
    color: gold;
}
.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
    gap: 20px;
    padding: 20px;
}
.card {
    background: white;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}
.info {
    padding: 15px;
}
.price {
    color: green;
    font-weight: bold;
}
button.buy {
    width: 100%;
    padding: 10px;
    background: black;
    color: white;
    border: none;
    cursor: pointer;
}
button.buy:hover {
    background: goldenrod;
}
</style>
</head>

<body>

<header>
    <h1>🚗 Premium Car Showroom</h1>
</header>

<nav>
    <button onclick="filterCars('all')">All</button>
    <button onclick="filterCars('classic')">Classic</button>
    <button onclick="filterCars('sports')">Sports</button>
    <button onclick="filterCars('luxury')">Luxury</button>
</nav>

<div class="container" id="cars"></div>

<script>

const carData = [
{ name:"Ford Mustang", img:"https://images.pexels.com/photos/1592384/pexels-photo-1592384.jpeg", category:"classic"},
{ name:"Chevrolet Camaro", img:"https://images.pexels.com/photos/3729464/pexels-photo-3729464.jpeg", category:"classic"},
{ name:"Porsche 911", img:"https://images.pexels.com/photos/1149831/pexels-photo-1149831.jpeg", category:"sports"},
{ name:"Ferrari 488", img:"https://images.pexels.com/photos/337909/pexels-photo-337909.jpeg", category:"sports"},
{ name:"Lamborghini Huracan", img:"https://images.pexels.com/photos/358070/pexels-photo-358070.jpeg", category:"sports"},
{ name:"Rolls Royce Phantom", img:"https://images.pexels.com/photos/358070/pexels-photo-358070.jpeg", category:"luxury"},
{ name:"Bentley Continental", img:"https://images.pexels.com/photos/3802510/pexels-photo-3802510.jpeg", category:"luxury"},
{ name:"Mercedes S-Class", img:"https://images.pexels.com/photos/100650/pexels-photo-100650.jpeg", category:"luxury"}
];

const places = ["Kathmandu","Pokhara","Lalitpur","Butwal"];
const colors = ["Red","Black","White","Blue","Silver"];
const models = ["Base","Sport","Premium"];

let cars = [];

// Generate 50 cars using real images
for(let i=0;i<50;i++){
    let base = carData[i % carData.length];
    cars.push({
        id:i,
        name: base.name + " " + (i+1),
        img: base.img,
        category: base.category,
        price: 50000 + i*2000,
        place: places[i % places.length],
        delivery: (2+i%5)+" days",
        holding: (1+i%3)+" days"
    });
}

function displayCars(list){
    let container = document.getElementById("cars");
    container.innerHTML = "";

    list.forEach(car => {
        container.innerHTML += `
        <div class="card">
            <img src="${car.img}">
            <div class="info">
                <h3>${car.name}</h3>
                <p class="price">$${car.price}</p>

                <p><b>📍 Place:</b> ${car.place}</p>
                <p><b>🚚 Delivery:</b> ${car.delivery}</p>
                <p><b>⏳ Holding:</b> ${car.holding}</p>

                <label>Color:</label>
                <select>
                    ${colors.map(c=>`<option>${c}</option>`).join("")}
                </select>

                <label>Model:</label>
                <select>
                    ${models.map(m=>`<option>${m}</option>`).join("")}
                </select>

                <button class="buy" onclick="buyCar('${car.name}')">Buy Now</button>
            </div>
        </div>
        `;
    });
}

function filterCars(type){
    if(type==="all"){
        displayCars(cars);
    } else {
        displayCars(cars.filter(c=>c.category===type));
    }
}

function buyCar(name){
    alert("You selected: " + name);
}

// load all
displayCars(cars);

</script>

</body>
</html>
