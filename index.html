<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Car Showroom</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
        }
        header {
            background: #111;
            color: #fff;
            padding: 15px;
            text-align: center;
        }
        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .car-card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            overflow: hidden;
            transition: 0.3s;
        }
        .car-card:hover {
            transform: scale(1.05);
        }
        .car-card img {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }
        .car-info {
            padding: 15px;
        }
        .car-info h3 {
            margin: 0;
        }
        .price {
            color: green;
            font-weight: bold;
            margin: 10px 0;
        }
        button {
            padding: 10px;
            background: #111;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #444;
        }
    </style>
</head>
<body>

<header>
    <h1>🚗 Premium Car Showroom</h1>
    <p>Find your dream car</p>
</header>

<div class="container">

    <div class="car-card">
        <img src="https://source.unsplash.com/400x300/?tesla" alt="Tesla">
        <div class="car-info">
            <h3>Tesla Model S</h3>
            <p class="price">$80,000</p>
            <button>Buy Now</button>
        </div>
    </div>

    <div class="car-card">
        <img src="https://source.unsplash.com/400x300/?bmw" alt="BMW">
        <div class="car-info">
            <h3>BMW M4</h3>
            <p class="price">$70,000</p>
            <button>Buy Now</button>
        </div>
    </div>

    <div class="car-card">
        <img src="https://source.unsplash.com/400x300/?audi" alt="Audi">
        <div class="car-info">
            <h3>Audi R8</h3>
            <p class="price">$120,000</p>
            <button>Buy Now</button>
        </div>
    </div>

    <div class="car-card">
        <img src="https://source.unsplash.com/400x300/?mercedes" alt="Mercedes">
        <div class="car-info">
            <h3>Mercedes Benz C-Class</h3>
            <p class="price">$60,000</p>
            <button>Buy Now</button>
        </div>
    </div>

    <div class="car-card">
        <img src="https://source.unsplash.com/400x300/?lamborghini" alt="Lamborghini">
        <div class="car-info">
            <h3>Lamborghini Huracan</h3>
            <p class="price">$200,000</p>
            <button>Buy Now</button>
        </div>
    </div>

    <div class="car-card">
        <img src="https://source.unsplash.com/400x300/?ford-mustang" alt="Mustang">
        <div class="car-info">
            <h3>Ford Mustang</h3>
            <p class="price">$55,000</p>
            <button>Buy Now</button>
        </div>
    </div>

</div>

</body>
</html>
