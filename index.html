<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone Showroom</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f7;
    }

    header {
      background: #000;
      color: #fff;
      text-align: center;
      padding: 20px;
      font-size: 24px;
    }

    nav {
      background: #111;
      text-align: center;
      padding: 10px;
    }

    nav input {
      padding: 10px;
      width: 250px;
      border-radius: 20px;
      border: none;
    }

    .products {
      padding: 30px;
      text-align: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      border-radius: 10px;
    }

    .btn {
      background: #0071e3;
      color: white;
      padding: 10px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      margin-top: 10px;
    }

  </style>
</head>

<body>

<header>🍎 iPhone Mega Showroom</header>

<nav>
  <input type="text" id="search" placeholder="Search iPhone...">
</nav>

<section class="products">
  <h2>All iPhones (100 Items)</h2>
  <div class="grid" id="productGrid"></div>
</section>

<script>
  const grid = document.getElementById("productGrid");
  const searchInput = document.getElementById("search");

  // Generate 100 products
  const products = [];

  const models = ["iPhone 15 Pro", "iPhone 15", "iPhone 14", "iPhone 13"];

  for (let i = 1; i <= 100; i++) {
    let model = models[i % models.length];
    products.push({
      name: model + " #" + i,
      price: 600 + (i * 5),
      image: "https://via.placeholder.com/250"
    });
  }

  function displayProducts(list) {
    grid.innerHTML = "";
    list.forEach(p => {
      grid.innerHTML += `
        <div class="card">
          <img src="${p.image}">
          <h3>${p.name}</h3>
          <p>$${p.price}</p>
          <button class="btn">Buy Now</button>
        </div>
      `;
    });
  }

  // Search function
  searchInput.addEventListener("keyup", () => {
    const value = searchInput.value.toLowerCase();
    const filtered = products.filter(p =>
      p.name.toLowerCase().includes(value)
    );
    displayProducts(filtered);
  });

  // Initial load
  displayProducts(products);
</script>

</body>
</html>
