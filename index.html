<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>iPhone Showroom</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      margin: 0;
      padding: 20px;
    }

    h1 {
      text-align: center;
    }

    .container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      padding: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: 0.3s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    img {
      width: 100%;
      height: 150px;
      object-fit: contain;
    }

    .price {
      color: green;
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>📱 iPhone Showroom (100 Products)</h1>

<div class="container" id="productContainer"></div>

<script>
  const container = document.getElementById("productContainer");

  for (let i = 1; i <= 100; i++) {
    let price = 500 + Math.floor(Math.random() * 1000);

    let card = `
      <div class="card">
        <img src="https://via.placeholder.com/150?text=iPhone+${i}" alt="iPhone ${i}">
        <h3>iPhone Model ${i}</h3>
        <p class="price">$${price}</p>
      </div>
    `;

    container.innerHTML += card;
  }
</script>

</body>
</html>
