<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Car Showroom</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f4f4f4;
}
header {
    background: black;
    color: white;
    text-align: center;
    padding: 20px;
}
.container {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px,1fr));
    gap: 20px;
    padding: 20px;
}
.card {
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    overflow: hidden;
}
.card img {
    width: 100%;
    height: 200px;
    object-fit: cover;
}
.info {
    padding: 15px;
}
.price {
    color: green;
    font-weight: bold;
}
select, button {
    width: 100%;
    padding: 8px;
    margin-top: 5px;
}
</style>
</head>

<body>

<header>
    <h1>🚗 Mega Car Showroom (50 Models)</h1>
    <p>All details: price, location, delivery & more</p>
</header>

<div class="container" id="cars"></div>

<script>
const carNames = [
"Tesla Model S","BMW M4","Audi R8","Mercedes C-Class","Ford Mustang",
"Lamborghini Huracan","Porsche 911","Toyota Supra","Nissan GTR","Honda Civic"
];

const places = ["Kathmandu","Pokhara","Lalitpur","Biratnagar","Butwal"];

const colors = ["Red","Black","White","Blue","Silver"];
const models = ["Base","Sport","Premium","Luxury"];

let container = document.getElementById("cars");

for(let i=1;i<=50;i++){

    let car = carNames[i % carNames.length];
    let price = (50000 + i*1500);
    let delivery = (3 + (i%7)) + " days";
    let holding = (2 + (i%5)) + " days";
    let place = places[i % places.length];

    let div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
    <img src="https://picsum.photos/400/200?random=${i}">
    <div class="info">
        <h3>${car} ${i}</h3>

        <p class="price">$${price}</p>

        <p><b>📍 Available at:</b> ${place}</p>
        <p><b>🚚 Delivery Time:</b> ${delivery}</p>
        <p><b>⏳ Holding Time:</b> ${holding}</p>

        <label>Select Color:</label>
        <select>
            ${colors.map(c => `<option>${c}</option>`).join("")}
        </select>

        <label>Select Model:</label>
        <select>
            ${models.map(m => `<option>${m}</option>`).join("")}
        </select>

        <button onclick="buyCar('${car}', ${price})">Buy Now</button>
    </div>
    `;

    container.appendChild(div);
}

function buyCar(name, price){
    alert("You selected: " + name + "\\nPrice: $" + price);
}
</script>

</body>
</html>
