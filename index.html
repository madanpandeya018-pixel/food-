<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iPhone Showroom</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f7;
      color: #1d1d1f;
    }

    header {
      background: #000;
      color: #fff;
      padding: 20px;
      text-align: center;
      font-size: 24px;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      justify-content: center;
      background: #111;
      padding: 10px;
    }

    nav a {
      color: #fff;
      margin: 0 15px;
      text-decoration: none;
      font-size: 16px;
    }

    nav a:hover {
      color: #0a84ff;
    }

    .hero {
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(to right, #000, #333);
      color: #fff;
    }

    .hero h1 {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 20px;
    }

    .btn {
      background: #0a84ff;
      color: #fff;
      padding: 12px 25px;
      border: none;
      cursor: pointer;
      border-radius: 20px;
    }

    .products {
      padding: 50px 20px;
      text-align: center;
    }

    .products h2 {
      margin-bottom: 30px;
      font-size: 32px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
    }

    .product-card {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .product-card img {
      width: 100%;
      border-radius: 10px;
    }

    .product-card h3 {
      margin: 15px 0;
    }

    .product-card button {
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 20px;
      background: #000;
      color: #fff;
      margin-top: 40px;
    }
  </style>
</head>

<body>

  <header>
    🍎 Premium iPhone Showroom
  </header>

  <nav>
    <a href="#">Home</a>
    <a href="#">Products</a>
    <a href="#">Offers</a>
    <a href="#">Contact</a>
  </nav>

  <section class="hero">
    <h1>Welcome to the Future</h1>
    <p>Discover the latest iPhones with best prices</p>
    <button class="btn">Shop Now</button>
  </section>

  <section class="products">
    <h2>Latest iPhones</h2>

    <div class="product-grid">

      <div class="product-card">
        <img src="https://via.placeholder.com/250" alt="iPhone">
        <h3>iPhone 15 Pro</h3>
        <p>$999</p>
        <button class="btn">Buy Now</button>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/250" alt="iPhone">
        <h3>iPhone 15</h3>
        <p>$799</p>
        <button class="btn">Buy Now</button>
      </div>

      <div class="product-card">
        <img src="https://via.placeholder.com/250" alt="iPhone">
        <h3>iPhone 14</h3>
        <p>$699</p>
        <button class="btn">Buy Now</button>
      </div>

    </div>
  </section>

  <footer>
    © 2026 iPhone Showroom | All Rights Reserved
  </footer>

</body>
</html>
